name: Publish Plugin
on:
  push:
    tags:
      - '*'

env:
  NO_SENTRY: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          submodules: true
      - name: Fetch latest submodule updates
        run: git submodule update --remote
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Setup publish token
        shell: bash
        run: |
          mkdir -p ~/.gradle/
          echo "GRADLE_USER_HOME=$HOME/.gradle" >> "$GITHUB_ENV"
          echo "mcdev.deploy.token=${JETBRAINS_TOKEN}" > ~/.gradle/gradle.properties
          echo "mcdev.sentry.token=${SENTRY_TOKEN}" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> ~/.gradle/gradle.properties
      - name: Get tag name
        id: get_tag
        shell: bash
        # Tag name is reversed from release name due to how IntelliJ parses plugin version numbers
        run: |
          tag_name="$(echo $GITHUB_REF | cut -d / -f 3)"
          echo tag=$tag_name >> $GITHUB_OUTPUT
          version_array=(${tag_name//-/ })
          echo release=${version_array[1]}-${version_array[0]} >> $GITHUB_OUTPUT

      - name: Publish plugin
        run: ./gradlew clean :assemble :buildPlugin --stacktrace
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: 'Release ${{ github.ref_name }}'
          body: 'RFG-enabled fork'
          prerelease: false
          draft: false
          files: build/distributions/*.zip
